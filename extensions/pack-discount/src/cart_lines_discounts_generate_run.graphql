# Only what the function needs: input size counts against the function's limits.
query CartInput {
  cart {
    lines {
      id
      quantity
      pack: attribute(key: "_pack") {
        value
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") {
      value
    }
  }
}
