# App that ships the pack-discount Function. Deploy with `shopify app deploy`.
client_id = "REPLACE_WITH_CLIENT_ID"
name = "racik"
application_url = "https://example.com"
embedded = false
extension_directories = ["extensions/*"]

[access_scopes]
# Seed script: products, selling plans, metaobjects, pages, files, the automatic discount.
scopes = "write_products,write_discounts,write_purchase_options,write_metaobject_definitions,write_metaobjects,write_online_store_pages,write_files,write_publications,read_locations"

[webhooks]
api_version = "2026-07"
